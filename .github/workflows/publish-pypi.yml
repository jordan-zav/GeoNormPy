name: Publish package

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-package
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine pytest
          python -m pip install -e .

      - name: Test before packaging
        run: python -m pytest -q

      - name: Verify release tag matches the package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          python -c "import os,pathlib,tomllib; version=tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']; tag=os.environ.get('RELEASE_TAG'); assert not tag or tag == 'v'+version, 'Release tag must match the package version'"

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: twine check --strict dist/*

      - name: Verify package metadata and source regression resources
        run: python scripts/check_distribution.py dist

      - name: Test the actual wheel
        run: >-
          python -c "import os,pathlib,pytest; os.environ['GEONORMPY_AUDIT_WHEEL']=str(next(pathlib.Path('dist').glob('*.whl')).resolve()); raise SystemExit(pytest.main(['tests/test_installed_wheel.py','-q']))"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/geonormpy/

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install twine
        run: python -m pip install --upgrade pip twine

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload --non-interactive dist/*
