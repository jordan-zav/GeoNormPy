name: Python package

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest build

      - name: Run tests
        run: pytest -q

      - name: Build distributions
        run: python -m build

      - name: Verify package metadata and source regression resources
        run: python scripts/check_distribution.py dist

      - name: Test the built wheel outside the checkout
        run: >-
          python -c "import os,pathlib,pytest; os.environ['GEONORMPY_AUDIT_WHEEL']=str(next(pathlib.Path('dist').glob('*.whl')).resolve()); raise SystemExit(pytest.main(['tests/test_installed_wheel.py','-q']))"
